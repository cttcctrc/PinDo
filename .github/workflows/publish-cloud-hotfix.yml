name: Publish PinDo cloud sync hotfix
on:
  push:
    branches: [fix/beta74-feedback]
    paths: [.github/workflows/publish-cloud-hotfix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Confirm validated source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/35943068443 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne 'db3af0ba28dd00f60acece0356f6ed204d8df8b5') { throw 'Windows validation did not pass for this source.' }
      - uses: actions/checkout@v4
        with:
          ref: db3af0ba28dd00f60acece0356f6ed204d8df8b5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and inspect hotfix installer
        shell: pwsh
        env:
          PINDO_RELEASE_VERSION: 1.1.0-beta.7.4-rc.5
        run: |
          npm test
          npm run check:desktop
          npx electron-builder --config electron-builder.candidate.cjs --win nsis --x64 --publish never
          node scripts/check-update-artifacts.cjs release-candidate $env:PINDO_RELEASE_VERSION test
          node scripts/windows-smoke.cjs release-candidate/win-unpacked/PinDo.exe release-candidate/smoke
      - name: Publish candidate and existing-client test alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem release-candidate -File | Where-Object { $_.Name -eq 'test.yml' -or $_.Name -match '\.exe$' -or $_.Name -match '\.exe\.blockmap$' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 3) { throw "Expected exactly three update assets, got $($assets.Count)" }
          gh release create v1.1.0-beta.7.4-rc.5 $assets --target db3af0ba28dd00f60acece0356f6ed204d8df8b5 --prerelease --title 'PinDo cloud sync hotfix rc.5' --notes 'Prevents cloud sync from multiplying conflict notes. Existing copies remain until reviewed.'
          gh release create v1.1.0-test.7.5 $assets --target db3af0ba28dd00f60acece0356f6ed204d8df8b5 --prerelease --title 'PinDo test channel cloud sync hotfix' --notes 'Same validated installer as rc.5, tagged for existing test channel clients.'
