name: Promote validated PinDo rc.6 to user update channel
on:
  push:
    branches: [fix/beta74-feedback]
    paths: [.github/workflows/promote-rc6-once.yml]
permissions:
  contents: write
jobs:
  promote:
    if: github.repository == 'cttcctrc/PinDo'
    runs-on: ubuntu-latest
    environment: pindo-production
    timeout-minutes: 15
    steps:
      - name: Verify candidate Windows validation and promote exact bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.1.0-beta.7.4-rc.6
        run: |
          set -euo pipefail
          validated=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35944553688 --jq '.conclusion + " " + .head_sha')
          test "$validated" = 'success a4356401ba8eafb78ca39b5b85947d449ec251bb'
          target=$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG --jq '.object.sha')
          test "$target" = 'a4356401ba8eafb78ca39b5b85947d449ec251bb'
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
          test -f candidate/test.yml
          test -f candidate/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe
          test -f candidate/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe.blockmap
          test "$(sed -n 's/^version: //p' candidate/test.yml)" = '1.1.0-beta.7.4-rc.6'
          expected=$(sed -n 's/^[[:space:]]*sha512: //p' candidate/test.yml | head -1)
          actual=$(openssl dgst -sha512 -binary candidate/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe | base64 -w0)
          test "$expected" = "$actual"
          cp candidate/test.yml candidate/latest.yml
          gh release upload "$TAG" candidate/latest.yml --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --notes 'Validated Windows candidate promoted to the user update channel without rebuilding. Cloud sync no longer multiplies notes; identical generated conflict copies can be reviewed and moved to the recycle bin after a local backup.'
