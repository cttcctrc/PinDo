name: Publish PinDo duplicate cleanup candidate
on:
  push:
    branches: [fix/beta74-feedback]
    paths: [.github/workflows/publish-duplicate-cleanup.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Verify source passed packaged Windows validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run = gh api repos/$env:GITHUB_REPOSITORY/actions/runs/35944553688 | ConvertFrom-Json
          if ($run.conclusion -ne 'success' -or $run.head_sha -ne 'a4356401ba8eafb78ca39b5b85947d449ec251bb') { throw 'Windows validation did not pass for this source.' }
      - uses: actions/checkout@v4
        with:
          ref: a4356401ba8eafb78ca39b5b85947d449ec251bb
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and smoke test cleanup candidate
        shell: pwsh
        env:
          PINDO_RELEASE_VERSION: 1.1.0-beta.7.4-rc.6
        run: |
          npm test
          npm run check:desktop
          npx electron-builder --config electron-builder.candidate.cjs --win nsis --x64 --publish never
          node scripts/check-update-artifacts.cjs release-candidate $env:PINDO_RELEASE_VERSION test
          node scripts/windows-smoke.cjs release-candidate/win-unpacked/PinDo.exe release-candidate/smoke
      - name: Publish candidate and test channel alias
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem release-candidate -File | Where-Object { $_.Name -eq 'test.yml' -or $_.Name -match '\.exe$' -or $_.Name -match '\.exe\.blockmap$' } | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 3) { throw "Expected exactly three update assets, got $($assets.Count)" }
          gh release create v1.1.0-beta.7.4-rc.6 $assets --target a4356401ba8eafb78ca39b5b85947d449ec251bb --prerelease --title 'PinDo duplicate cleanup candidate rc.6' --notes 'Preview and recycle exact duplicate conflict copies after a forced backup; preserve edited copies.'
          gh release create v1.1.0-test.7.6 $assets --target a4356401ba8eafb78ca39b5b85947d449ec251bb --prerelease --title 'PinDo test channel duplicate cleanup' --notes 'Same validated installer as rc.6, tagged for existing test channel clients.'
