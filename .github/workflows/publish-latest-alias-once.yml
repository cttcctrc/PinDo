name: Publish legacy latest-channel update alias
on:
  push:
    branches: [fix/beta74-feedback]
    paths: [.github/workflows/publish-latest-alias-once.yml]
permissions:
  contents: write
jobs:
  alias:
    if: github.repository == 'cttcctrc/PinDo'
    runs-on: ubuntu-latest
    environment: pindo-production
    timeout-minutes: 15
    steps:
      - name: Verify validated stable release and publish identical assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: v1.1.0-beta.7.4-rc.6
          ALIAS: v1.1.0-latest.7.4
        run: |
          set -euo pipefail
          validated=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/35944553688 --jq '.conclusion + " " + .head_sha')
          test "$validated" = 'success a4356401ba8eafb78ca39b5b85947d449ec251bb'
          stable=$(gh release view "$CANDIDATE" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          test "$stable" = 'false'
          mkdir stable
          gh release download "$CANDIDATE" --repo "$GITHUB_REPOSITORY" --dir stable
          test -f stable/latest.yml
          test -f stable/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe
          test -f stable/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe.blockmap
          test "$(sed -n 's/^version: //p' stable/latest.yml)" = '1.1.0-beta.7.4-rc.6'
          expected=$(sed -n 's/^[[:space:]]*sha512: //p' stable/latest.yml | head -1)
          actual=$(openssl dgst -sha512 -binary stable/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe | base64 -w0)
          test "$expected" = "$actual"
          gh release create "$ALIAS" stable/latest.yml stable/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe stable/PinDo-Desktop-Test-1.1.0-beta.7.4-rc.6-x64.exe.blockmap --repo "$GITHUB_REPOSITORY" --target a4356401ba8eafb78ca39b5b85947d449ec251bb --prerelease --title 'PinDo user update channel compatibility' --notes 'Identical validated production installer tagged so existing latest-channel clients receive the update.'
