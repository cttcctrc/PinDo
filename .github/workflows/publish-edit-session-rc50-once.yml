name: Correct PinDo edit-session rc.50 assets once

on:
  push:
    branches: [fix/pindo-ux-org-01]
    paths: [.github/workflows/publish-edit-session-rc50-once.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPOSITORY: cttcctrc/PinDo
      VALIDATED_RUN_ID: "38880263985"
      VALIDATED_SHA: a013a2fe1e20a6513d6cbcbbfa91f925812884e2
      RELEASE_TARGET_SHA: a013a2fe1e20a6513d6cbcbbfa91f925812884e2
      ARTIFACT_NAME: pindo-edit-session-rc50-21
      TAG: v1.1.0-test.75.50
      VERSION: 1.1.0-beta.7.5-rc.50-editfix
      EXE_SHA256: 0814d1e8f37934ec352aeb64a3d9e44ac26c0d786e5b8511ac8d18dbc4029dc3
      BLOCKMAP_SHA256: 81bdf285e7e0f9b3fabd20b0ea8396a58af70a238a6e8269ea8f2cbdfedace0a
      METADATA_SHA256: 8b2f14227d79627f74a51416029f8aa6db46538a50a8cf7ce3395d1aa23b5360
    steps:
      - name: Download exact validated candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$VALIDATED_RUN_ID" --repo "$REPOSITORY" --name "$ARTIFACT_NAME" --dir candidate

      - name: Verify commit, bytes and update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPOSITORY/actions/runs/$VALIDATED_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$REPOSITORY/actions/runs/$VALIDATED_RUN_ID" --jq .head_sha)" = "$VALIDATED_SHA"
          exe="candidate/release-candidate/PinDo-Desktop-Test-$VERSION-x64.exe"
          blockmap="$exe.blockmap"
          metadata="candidate/release-candidate/test.yml"
          test -f "$exe" && test -f "$blockmap" && test -f "$metadata"
          echo "$EXE_SHA256  $exe" | sha256sum --check --strict
          echo "$BLOCKMAP_SHA256  $blockmap" | sha256sum --check --strict
          echo "$METADATA_SHA256  $metadata" | sha256sum --check --strict
          grep -Fx "version: $VERSION" "$metadata"
          test "$(find candidate/release-candidate -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find candidate/release-candidate -maxdepth 1 -name '*.exe.blockmap' | wc -l)" -eq 1

      - name: Replace the incorrect rc.50 assets in the existing prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = true
          release_id="$(jq -r .id <<<"$release")"
          gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/$TAG" -f sha="$RELEASE_TARGET_SHA" -F force=true >/dev/null
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -f target_commitish="$RELEASE_TARGET_SHA" >/dev/null
          exe="candidate/release-candidate/PinDo-Desktop-Test-$VERSION-x64.exe"
          gh release upload "$TAG" "$exe" "$exe.blockmap" candidate/release-candidate/test.yml --repo "$REPOSITORY" --clobber
          gh release delete-asset "$TAG" "PinDo-Desktop-Test-1.1.0-beta.7.5-rc.50-x64.exe" --repo "$REPOSITORY" --yes 2>/dev/null || true
          gh release delete-asset "$TAG" "PinDo-Desktop-Test-1.1.0-beta.7.5-rc.50-x64.exe.blockmap" --repo "$REPOSITORY" --yes 2>/dev/null || true
          gh release edit "$TAG" --repo "$REPOSITORY" \
            --title "PinDo $VERSION edit-session correction candidate" \
            --notes "Test-channel candidate correcting the rc.44-rc.49 desktop-note edit-focus regression. Ordinary clicks remain Explorer-hosted; explicit editing uses one bounded non-TopMost native edit session and returns to the desktop host after editing. Packaged Windows smoke passed native text input, Ctrl+C, clipboard round-trip and host restoration. The editfix suffix preserves automatic-update precedence over rc.49-diag. CF-08 Win+D black rectangles remain open; this candidate is not FINAL ACCEPTED and must be tested on the affected LTSC 2019 machine."

      - name: Verify published test-channel metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .prerelease <<<"$release")" = true
          test "$(jq -r .target_commitish <<<"$release")" = "$RELEASE_TARGET_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$RELEASE_TARGET_SHA"
          test "$(jq '.assets | length' <<<"$release")" -eq 3
          curl --fail --silent --show-error --location \
            "https://github.com/$REPOSITORY/releases/download/$TAG/test.yml" \
            --output published-test.yml
          echo "$METADATA_SHA256  published-test.yml" | sha256sum --check --strict
          grep -Fx "version: $VERSION" published-test.yml
