name: Build and publish PinDo for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test desktop application
        run: npm test

      - name: Check desktop architecture
        run: npm run check:desktop

      - name: Ensure release tag exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.1.0-beta.7.1
        run: |
          git fetch --tags --force
          if (-not (git tag --list $env:RELEASE_TAG)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin $env:RELEASE_TAG
          }

      - name: Build Windows release files
        shell: pwsh
        env:
          PINDO_RELEASE_VERSION: 1.1.0-beta.7.1
        run: |
          npx electron-builder --config electron-builder.production.cjs --win nsis --x64 --publish never
          node scripts/check-update-artifacts.cjs release-public 1.1.0-beta.7.1

      - name: Publish complete GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.1.0-beta.7.1
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "PinDo 1.1.0 beta 7.1" --notes "Compatibility diagnostics, privacy-safe report export, window position recovery and automatic GPU fallback after repeated abnormal exits. Existing notes, settings and cloud accounts are preserved."
          }

          $assets = Get-ChildItem "release-public" -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -match "\.exe$" -or
            $_.Name -match "\.exe\.blockmap$"
          } | ForEach-Object { $_.FullName }

          if ($assets.Count -lt 3) {
            throw "Expected installer, blockmap and latest.yml before publishing."
          }

          gh release upload $env:RELEASE_TAG $assets --clobber

      - name: Preserve build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pindo-windows-release
          path: release-public/**
          if-no-files-found: warn
          retention-days: 14
