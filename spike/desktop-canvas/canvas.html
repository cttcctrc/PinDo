<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PinDo 画布技术验证版</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font:14px/1.5 'Microsoft YaHei',system-ui,sans-serif;color:#25262c}#canvas{position:absolute;inset:0;pointer-events:none}.note{position:absolute;display:flex;flex-direction:column;min-width:230px;min-height:170px;border-radius:21px;background:#fdfdff;box-shadow:0 14px 36px #10172b50,0 0 0 1px #00000016;pointer-events:auto;overflow:hidden}.note.organizer{background:#222427;color:#fafafa}.note.todo{background:#f1f6ff}.note.quick{background:#fff9f8}.header{display:flex;gap:10px;align-items:center;padding:15px 18px 9px;cursor:move;touch-action:none;user-select:none;font-weight:700}.dot{width:10px;height:10px;flex:none;border-radius:50%;background:#7c67be}.organizer .dot{background:#e8a839}.todo .dot{background:#5b91dd}.title{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;outline:none}.title:focus{background:#ffffff21;border-radius:4px}.body{flex:1;overflow:auto;margin:0 15px 18px;padding:12px;border-radius:13px;background:#ffffffb9;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:text}.organizer .body{background:#ffffff0d}.body:focus{outline:2px solid #7c67be55}.grip{position:absolute;right:0;bottom:0;width:25px;height:25px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 60%,#9799aa 60%,#9799aa 68%,transparent 68%,transparent 79%,#9799aa 79%)}
</style></head><body><main id="canvas"></main><script>
(() => {
'use strict';
const canvas=document.getElementById('canvas');let state={notes:[]};let action=null;let saveTimer;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>window.canvasPreview.save(state),350)}
function regions(){window.canvasPreview.regions([...canvas.querySelectorAll('.note')].map(el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}}))}
function position(el,note){el.style.left=note.x+'px';el.style.top=note.y+'px';el.style.width=note.width+'px';el.style.height=note.height+'px';regions()}
function finish(){if(!action)return;try{action.target.releasePointerCapture(action.pointerId)}catch{}action=null;window.canvasPreview.gesture(false);persist();regions()}
function start(event,note,el,kind){if(event.button!==0||action)return;event.preventDefault();const target=event.currentTarget;action={target,pointerId:event.pointerId,kind,note,el,x:event.clientX,y:event.clientY,left:note.x,top:note.y,width:note.width,height:note.height};target.setPointerCapture(event.pointerId);window.canvasPreview.gesture(true)}
function move(event){if(!action||event.pointerId!==action.pointerId)return;const a=action,dx=event.clientX-a.x,dy=event.clientY-a.y;if(a.kind==='move'){a.note.x=clamp(a.left+dx,0,Math.max(0,innerWidth-120));a.note.y=clamp(a.top+dy,0,Math.max(0,innerHeight-90))}else{a.note.width=clamp(a.width+dx,230,Math.max(230,innerWidth-a.note.x));a.note.height=clamp(a.height+dy,170,Math.max(170,innerHeight-a.note.y))}position(a.el,a.note)}
function render(){canvas.replaceChildren();for(const note of state.notes){const el=document.createElement('section');el.className='note '+note.type;el.dataset.id=note.id;const header=document.createElement('div');header.className='header';const dot=document.createElement('i');dot.className='dot';const title=document.createElement('div');title.className='title';title.contentEditable='true';title.spellcheck=false;title.textContent=note.title;title.addEventListener('pointerdown',e=>e.stopPropagation());title.addEventListener('input',()=>{note.title=title.textContent.slice(0,120);persist()});title.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();title.blur()}});header.append(dot,title);header.addEventListener('pointerdown',e=>start(e,note,el,'move'));header.addEventListener('pointermove',move);header.addEventListener('pointerup',finish);header.addEventListener('pointercancel',finish);const body=document.createElement('div');body.className='body';body.contentEditable='true';body.spellcheck=false;body.textContent=note.text;body.addEventListener('input',()=>{note.text=body.innerText.slice(0,5000);persist()});const grip=document.createElement('div');grip.className='grip';grip.title='拖动缩放';grip.addEventListener('pointerdown',e=>start(e,note,el,'resize'));grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',finish);grip.addEventListener('pointercancel',finish);el.append(header,body,grip);canvas.append(el);position(el,note)}regions()}
window.addEventListener('resize',regions);window.addEventListener('blur',finish);window.canvasPreview.load().then(data=>{state=data||{notes:[]};render()});
window.canvasSmokeCheck=()=>{const cards=[...canvas.querySelectorAll('.note')];const first=cards[0];if(!first)return{passed:false,reason:'No cards'};const note=state.notes[0];const before={x:note.x,width:note.width};const header=first.querySelector('.header'),grip=first.querySelector('.grip');const fire=(target,type,id,x,y)=>target.dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:id,pointerType:'mouse',button:0,clientX:x,clientY:y}));try{fire(header,'pointerdown',41,130,130);fire(header,'pointermove',41,156,149);fire(header,'pointerup',41,156,149);fire(grip,'pointerdown',42,400,550);fire(grip,'pointermove',42,422,570);fire(grip,'pointerup',42,422,570)}catch(error){return{passed:false,reason:String(error)}}const title=first.querySelector('.title');title.textContent='测试标题';title.dispatchEvent(new Event('input',{bubbles:true}));const body=first.querySelector('.body');body.textContent='测试输入';body.dispatchEvent(new Event('input',{bubbles:true}));const passed=cards.length===3&&note.x===before.x+26&&note.width===before.width+22&&note.title==='测试标题'&&note.text==='测试输入'&&getComputedStyle(document.body).backgroundColor==='rgba(0, 0, 0, 0)';return{passed,cards:cards.length,moved:note.x-before.x,resized:note.width-before.width,editable:note.title==='测试标题'&&note.text==='测试输入',transparent:getComputedStyle(document.body).backgroundColor}};
})();
</script></body></html>
